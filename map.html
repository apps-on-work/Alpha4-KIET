<!DOCTYPE html>
<html lang="en">
<head>
    <title>Map</title>

    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style18.css">

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            font-family: "Google Sans", sans-serif;
        }

        .page-top-bottom {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 80px;
        }

        .sidebar {
            width: 100%;
            background: #000;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #ffffff;
            color: #fff;
        }

        .direction-form {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .direction-form label {
            margin-right: 5px;
        }

        .direction-form select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #fff;
            background: #111;
            color: #fff;
        }

        .main-content {
            width: 100%;
        }

        #map {
            width: 100%;
            height: 600px;
            border: 1px solid #ffffff;
            border-radius: 20px;
        }

        @media (max-width: 768px) {
            .page-top-bottom {
                padding: 20px;
            }
        }

        .leaflet-container {
            z-index: 1;
        }

        .sidebar h2 {
            margin-bottom: 10px;
        }

    </style>
</head>

<body>

<header class="navbar">
    <div class="logo">
        <a href="home.html"><img src="assets/logo.png" alt="Logo"></a>
        <span><b>Alpha4 by Blassels</b></span>
    </div>

    <nav>
        <a href="home.html">Home</a>
        <a href="clubs.html">Clubs</a>
        <a href="events.html">Events</a>
        <a href="guide.html">101</a>
        <a href="map.html">Map</a>
        <a href="index.html" class="button">Log out</a>
    </nav>
</header>

<div class="container">
    <div class="page-top-bottom">

        <aside class="sidebar">
            <h2>Directions</h2>

            <div class="direction-form">
                <div>
                    <label for="from">From:</label>
                    <select id="from">
                        <option value="">--Select--</option>
                        <option value="A">Main Gate</option>
                        <option value="B">Library</option>
                        <option value="C">G-Block</option>
                        <option value="D">KSOP</option>
                        <option value="E">Auditorium</option>
                        <option value="F">Cafeteria</option>
                        <option value="G">TBI KIET</option>
                    </select>
                </div>

                <div>
                    <label for="to">To:</label>
                    <select id="to">
                        <option value="">--Select--</option>
                        <option value="A">Main Gate</option>
                        <option value="B">Library</option>
                        <option value="C">G-Block</option>
                        <option value="D">KSOP</option>
                        <option value="E">Auditorium</option>
                        <option value="F">Cafeteria</option>
                        <option value="G">TBI KIET</option>
                    </select>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div id="map"></div>
        </main>

    </div>
</div>

<footer class="site-footer">
    <p>© 2025-2029. All rights reserved.</p>
    <img src="assets/logo.png" alt="Logo" class="footer-logo">
    <p><b>by</b></p>
    <img src="assets/blaa.jpeg" alt="Blaa" class="footer-logo">
</footer>

</body>
</html>
